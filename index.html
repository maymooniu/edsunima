const ORG_POSITIONS = ['President','Vice President','Secretary','Treasurer','Training Director','Training Officer','People Director','People Officer','MedCom Director','MedCom Officer'];

function OrgNode({ b, m, tier }) {
  return (
    <div className={`org-node n${tier}`}>
      <div className="org-ava">
        {b?.photo_url ? <img src={b.photo_url} alt={b.member_name} /> : '👤'}
      </div>
      <div className="org-pos">{b?.position || '—'}</div>
      <div className="org-nm">{b?.member_name || <span style={{color:'var(--text3)',fontStyle:'italic',fontSize:'.72rem'}}>Vacant</span>}</div>
      {m && <div className="org-badges"><DivBadge div={m.division}/><RankBadge rank={m.rank}/></div>}
      <div className="org-tip">
        {m ? <>
          <div className="org-tip-row"><span className="org-tip-k">Division</span><span className="org-tip-v">{m.division}</span></div>
          <div className="org-tip-row"><span className="org-tip-k">Rank</span><span className="org-tip-v">{m.rank}</span></div>
          <div className="org-tip-row"><span className="org-tip-k">Comps</span><span className="org-tip-v" style={{color:'var(--accent)'}}>{m.total_competitions||0}</span></div>
          <div className="org-tip-row"><span className="org-tip-k">Breaks</span><span className="org-tip-v" style={{color:'var(--gold)'}}>{m.total_breaking||0}</span></div>
          {m.top_round && <div className="org-tip-row"><span className="org-tip-k">Top Round</span><span className="org-tip-v" style={{color:'var(--green)'}}>{m.top_round}</span></div>}
        </> : <div style={{color:'var(--text3)',fontSize:'.72rem'}}>{b?.extra_info || 'No member assigned'}</div>}
      </div>
    </div>
  );
}

function OrgConnector({ count, nodeW, gap }) {
  // Total width of the children row this connector must span
  const totalW = count * nodeW + (count - 1) * gap;
  const cx = totalW / 2;
  // Center x of each child node
  const centers = Array.from({length:count}, (_,i) => i*(nodeW+gap) + nodeW/2);
  const H = 44;
  const midY = 22;
  const s = 'var(--org-line)';
  const sw = '2';
  if (count === 1) return (
    <svg width={nodeW} height={H} style={{display:'block',margin:'0 auto',flexShrink:0}} overflow="visible">
      <line x1={nodeW/2} y1={0} x2={nodeW/2} y2={H} stroke={s} strokeWidth={sw}/>
    </svg>
  );
  return (
    <svg width={totalW} height={H} style={{display:'block',margin:'0 auto',flexShrink:0}} overflow="visible">
      {/* vertical from parent down to mid */}
      <line x1={cx} y1={0} x2={cx} y2={midY} stroke={s} strokeWidth={sw}/>
      {/* horizontal bar */}
      <line x1={centers[0]} y1={midY} x2={centers[count-1]} y2={midY} stroke={s} strokeWidth={sw}/>
      {/* vertical drops to each child */}
      {centers.map((x,i)=>(
        <line key={i} x1={x} y1={midY} x2={x} y2={H} stroke={s} strokeWidth={sw}/>
      ))}
    </svg>
  );
}

function BoardsTab({ boards, members }) {
  const gm = name => members.find(m=>m.full_name?.toLowerCase()===name?.toLowerCase());
  const gb = pos => boards.find(b=>b.position===pos)||null;

  if (boards.length === 0) return (

    </div>

  // Fixed card widths and gaps — must be consistent between SVG calc and CSS gap
  const N1=176, N2=164, N3=150, G2=48, G3=32;
  // Each department column is the node width (no extra padding so SVG aligns exactly)
  const deptColW = N3;
  // Total dept row width = 3*N3 + 2*G3
  const deptTotalW = 3*N3 + 2*G3;

  // Vertical line between rows
  const VLine = ({h=36}) => (
    <div style={{width:2,height:h,background:'var(--org-line)',margin:'0 auto'}} />
  );

  const depts = [
    {label:'Training', dir:'Training Director', off:'Training Officer'},
    {label:'People',   dir:'People Director',   off:'People Officer'},

  return (
    <div className="pub-content" style={{overflowX:'auto',WebkitOverflowScrolling:'touch'}}>

        {/* ── President ── */}
        <OrgNode b={gb('President')} m={gm(gb('President')?.member_name)} tier={1} />

        {/* line down to VP */}
        <VLine />

        {/* ── Vice President ── */}
        <OrgNode b={gb('Vice President')} m={gm(gb('Vice President')?.member_name)} tier={1} />

        {/* connector VP → Sec + Treas: SVG spans exactly 2*N2 + G2 */}
        <OrgConnector count={2} nodeW={N2} gap={G2} />

        {/* ── Secretary + Treasurer ── */}
        <div style={{display:'flex',gap:G2,alignItems:'flex-start',flexShrink:0}}>
          {['Secretary','Treasurer'].map(pos=>(
            <div key={pos} style={{width:N2,flexShrink:0}}>
              <OrgNode b={gb(pos)} m={gm(gb(pos)?.member_name)} tier={2} />
            </div>
          ))}
        </div>

        {/* connector Sec/Treas → 3 dept columns: SVG spans exactly deptTotalW */}
        <OrgConnector count={3} nodeW={deptColW} gap={G3} />

        {/* ── 3 Department columns ── */}
        <div style={{display:'flex',gap:G3,alignItems:'flex-start',flexShrink:0}}>
          {depts.map(dept=>(
            <div key={dept.label} style={{width:deptColW,display:'flex',flexDirection:'column',alignItems:'center',flexShrink:0}}>
              {/* dept label */}

                {dept.label}
              </div>
              {/* Director */}
              <div style={{width:deptColW,flexShrink:0}}>
                <OrgNode b={gb(dept.dir)} m={gm(gb(dept.dir)?.member_name)} tier={3} />
              </div>
              {/* line Director → Officers */}
              {boards.filter(b => b.position === dept.off).map((off, idx) => (
                <React.Fragment key={off.id || idx}>
                  <VLine h={24} />
                  <div style={{width:deptColW,flexShrink:0}}>
                    <OrgNode b={off} m={gm(off.member_name)} tier={3} />
                  </div>
                </React.Fragment>
              ))}
            </div>

        </div>

      </div>

      {/* Legend */}
      <div style={{display:'flex',flexWrap:'wrap',gap:12,justifyContent:'center',padding:'14px 0',borderTop:'1px solid var(--border)'}}>
        {[

          {c:'rgba(108,143,255,.3)',bg:'rgba(108,143,255,.07)', lbl:'Senior (Sec / Treas)'},

            {l.lbl}
          </div>

        <div style={{fontSize:'.71rem',color:'var(--text3)',fontStyle:'italic'}}>Hover a card to see stats</div>
      </div>
    </div>
  );

  const getMember = name => members.find(m=>m.full_name?.toLowerCase()===name?.toLowerCase());

  const upsert = async (boardId, pos, memberId, photoUrl, extraInfo) => {
    const member = members.find(m=>m.id===+memberId);
    const payload = {
      position:pos,
      member_name:member?.full_name||'',
      photo_url:photoUrl||'',
      extra_info:extraInfo||'',
      sort_order:ORG_POSITIONS.indexOf(pos)+1,
    };
    if (boardId) {
      const {error} = await sb.from('boards').update(payload).eq('id',boardId);
      if(error) toast(error.message,'error'); else toast('Updated');
    } else {
      const {error} = await sb.from('boards').insert(payload);
      if(error) toast(error.message,'error'); else toast('Assigned');
    }
    await refetch(); setEditKey(null);
  };

    await sb.from('boards').delete().eq('id',id);

        <button className="btn btn-primary btn-sm" onClick={()=>{setEditH(null);setShowForm(true);}}>+ Add Inductee</button>
      </div>
      <div className="card">
        <div className="tbl-wrap">
          <table>
            <thead><tr><th style={{width:24}}></th><th>#</th><th>Name</th><th>Award Title</th><th>Year</th><th>Photo</th><th>Actions</th></tr></thead>
            <tbody>
              {ordered.length===0 && <tr><td colSpan={7} style={{textAlign:'center',color:'var(--text3)',padding:36}}>No entries yet</td></tr>}
              {ordered.map((h,i)=>(
                <tr key={h.id} className={`drag-row ${isDragOver(i)?'drag-over':''}`} draggable onDragStart={e=>onDragStart(e,i)} onDragOver={e=>onDragOver(e,i)} onDrop={e=>onDrop(e,i)} onDragEnd={onDragEnd}>
                  <td><span className="drag-handle">⠿</span></td>
                  <td style={{color:'var(--text3)',fontWeight:600,fontSize:'.72rem'}}>{i+1}</td>
                  <td style={{fontWeight:600}}>{h.name}</td>
                  <td style={{color:'var(--gold)',fontSize:'.82rem',fontWeight:600}}>{h.award_title}</td>
                  <td style={{color:'var(--text3)',fontSize:'.78rem'}}>{h.year||'—'}</td>
                  <td>{h.photo_url?<img src={h.photo_url} style={{width:32,height:32,borderRadius:'50%',objectFit:'cover',border:'1px solid var(--border)'}} alt=""/>:<span style={{color:'var(--text3)',fontSize:'.75rem'}}>—</span>}</td>
                  <td><div style={{display:'flex',gap:4}}><button className="btn btn-outline btn-xs" onClick={()=>{setEditH(h);setShowForm(true);}}>Edit</button><button className="btn btn-danger btn-xs" onClick={()=>setConfirm(h.id)}>Del</button></div></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
      {showForm && <HofForm entry={editH} onSave={addOrUpdate} onClose={()=>{setShowForm(false);setEditH(null);}} />}
      {confirm && <Modal title="Delete?" onClose={()=>setConfirm(null)} sm><p style={{color:'var(--text3)'}}>Remove this Hall of Fame entry?</p><div className="m-footer"><button className="btn btn-ghost" onClick={()=>setConfirm(null)}>Cancel</button><button className="btn btn-danger" onClick={()=>del(confirm)}>Delete</button></div></Modal>}
    </div>
  );
}

            <div key={c.key} className="home-card" onClick={()=>onNav(c.key)}>
              <div className="home-card-icon">{c.icon}</div>
              <div className="home-card-title">{c.title}</div>
              <div className="home-card-desc">{c.desc}</div>
            </div>
          ))}
        </div>

        {/* Secondary nav cards */}
        <div style={{
          display:'grid',
          gridTemplateColumns:`repeat(${settings.show_stats_on_public !== false ? 4 : 3}, 1fr)`,
          gap:10,
          maxWidth:700,
          width:'100%',
          marginBottom:20
        }}>
          {[
            settings.show_stats_on_public !== false && {key:'stats',icon:'📊',title:'Stats'},
            {key:'boards',icon:'🏛️',title:'Board'},
            {key:'hof',icon:'🌟',title:'Hall of Fame'},
            {key:'info',icon:'ℹ️',title:'Info'},
          ].filter(Boolean).map(c=>(
            <div key={c.key} className="home-tool-card" onClick={()=>onNav(c.key)} style={{cursor:'pointer'}}>
              <div className="home-tool-icon">{c.icon}</div>
              <div className="home-tool-title">{c.title}</div>
            </div>
          ))}
        </div>

        {/* Debate Tools */}
        <div style={{width:'100%',maxWidth:700}}>
          <div style={{fontSize:'.6rem',fontWeight:600,letterSpacing:'.12em',textTransform:'uppercase',color:'var(--text3)',marginBottom:9,textAlign:'center'}}>Debate Tools</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:10}}>
            <a className="home-tool-card" href="https://maymooniu.github.io/debatetimekeeper/" target="_blank" rel="noreferrer">
              <div className="home-tool-icon">⏱️</div>
              <div className="home-tool-title">Advanced BP Debate Timer</div>
              <div className="home-tool-desc">Full-featured timer for British Parliamentary rounds</div>
            </a>
            <a className="home-tool-card" href="https://maymooniu.github.io/adjudebatenotetaking/" target="_blank" rel="noreferrer">
              <div className="home-tool-icon">📝</div>
              <div className="home-tool-title">Adjudicator Note-taking</div>
              <div className="home-tool-desc">Structured note-taking assistant for adjudicators</div>
            </a>
          </div>
        </div>
      </div>
      <div className="home-footer">{settings.footer_text||'English Debating Society · Universitas Negeri Manado'}</div>
    </div>
  );
}

// ─── UPDATED ROOT APP ─────────────────────────────────────────────────────────
function App2() {
  const [view, setView] = useState('home');
  const [tab, setTab] = useState('debaters');
  const [isAdmin, setIsAdmin] = useState(false);
  const [showPrefs, setShowPrefs] = useState(false);

  const { members, loading:mLoad, refetch:refetchMembers } = useMembers();
  const { competitions, loading:cLoad, refetch:refetchCompetitions } = useCompetitions();
  const { settings, saveSetting } = useSettings();
  const { boards, refetch:refetchBoards } = useBoards();
  const { hof, refetch:refetchHof } = useHof();
  const { info, saveInfo } = useInfoSettings();
  const { prefs, setPref } = useUserPrefs();

  // Apply user preferences globally when they change
  useEffect(() => {
    if (prefs.theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
  }, [prefs.theme]);

  useEffect(() => {
    document.body.setAttribute('data-compact', prefs.compact_tables ? 'true' : 'false');
  }, [prefs.compact_tables]);

  useEffect(() => {
    if (prefs.accent_color) applyAccent(prefs.accent_color);
  }, [prefs.accent_color]);

  useEffect(() => {
    document.body.setAttribute('data-show-rank-icons', prefs.show_rank_icons !== false ? 'true' : 'false');
  }, [prefs.show_rank_icons]);

  const navTo = key => {
    if (key==='home'){setView('home');return;}
    if (key==='admin'){setView('admin-login');return;}
    setView('public'); setTab(key);
  };

  if (mLoad && view==='home') return (
    <div className="loading-pg">
      <div style={{width:46,height:46,borderRadius:12,background:'linear-gradient(135deg,var(--accent),var(--accent2))',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Playfair Display,serif',fontSize:'1.1rem',color:'#fff',fontWeight:700,marginBottom:4}}>E</div>
      <div className="spin"/>
      <p>Loading EDS UNIMA database…</p>
    </div>
  );

  if (settings.maintenance_mode && view!=='admin-login' && view!=='admin') return (
    <div className="loading-pg">
      <div style={{fontSize:'2rem',marginBottom:10}}>🔧</div>
      <p style={{fontSize:'.95rem',color:'var(--text)',fontWeight:600}}>Under Maintenance</p>
      <p>The database is currently undergoing maintenance.</p>
      <button className="btn btn-ghost btn-sm" style={{marginTop:12}} onClick={()=>setView('admin-login')}>Admin Access</button>
    </div>
  );

  if (view==='home') return <HomePage2 onNav={navTo} settings={settings} />;
  if (view==='admin-login') return <AdminLogin onLogin={()=>{setIsAdmin(true);setView('admin');}} settings={settings} />;
  if (view==='admin'&&isAdmin) return (
    <AdminShell2 onLogout={()=>{setIsAdmin(false);setView('home');}}
      members={members} refetchMembers={refetchMembers}
      competitions={competitions} refetchCompetitions={refetchCompetitions}
      settings={settings} saveSetting={saveSetting}
      boards={boards} refetchBoards={refetchBoards}
      hof={hof} refetchHof={refetchHof}
      info={info} saveInfo={saveInfo}
    />
  );

  return (
    <>
      <PublicShell2 tab={tab} setTab={t=>{setView('public');setTab(t);}} onHome={()=>setView('home')} settings={settings} onAdminNav={()=>setView('admin-login')} showPrefs={showPrefs} setShowPrefs={setShowPrefs}>
        {tab==='debaters' && <DebatersTab members={members} loading={mLoad} settings={settings} competitions={competitions} />}
        {tab==='competitions' && <CompetitionsTab competitions={competitions} members={members} loading={cLoad} settings={settings} />}
        {tab==='membership' && <MembershipTab members={members} loading={mLoad} competitions={competitions} settings={settings} />}
        {tab==='stats' && <PublicDashboard members={members} competitions={competitions} loading={mLoad||cLoad} />}
        {tab==='boards' && <BoardsTab boards={boards} members={members} />}
        {tab==='hof' && <HallOfFameTab hof={hof} />}
        {tab==='info' && <InfoTab info={info} settings={settings} />}
      </PublicShell2>
      {showPrefs && <UserPrefsPanel prefs={prefs} setPref={setPref} onClose={()=>setShowPrefs(false)} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App2 />);
</script>
</body>
</html>
