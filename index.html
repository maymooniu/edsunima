<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>EDS UNIMA — Member Database</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.18.0/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090e;--surface:#11141c;--surface2:#171c28;--surface3:#1f2636;
  --border:rgba(255,255,255,.05);--border2:rgba(255,255,255,.095);
  --accent:#5b82f6;--accent2:#906ef5;
  --gold:#dfaa32;--gold2:#f0c66e;--gold-dim:rgba(223,170,50,.1);--gold-border:rgba(223,170,50,.2);
  --text:#f0f2f8;--text2:#949ab5;--text3:#505673;
  --green:#34d399;--green-bg:rgba(52,211,153,.1);
  --red:#f87171;--red-bg:rgba(248,113,113,.1);
  --blue:#60a5fa;--blue-bg:rgba(96,165,250,.1);
  --purple:#c084fc;--purple-bg:rgba(192,132,252,.1);
  --magenta:#f472b6;--magenta-bg:rgba(244,114,182,.1);
  --ex:#ef4444;--ex-bg:rgba(239,68,68,.1);
  --orange:#fb923c;--orange-bg:rgba(251,146,60,.1);
  --r:10px;--r2:14px;--r3:18px;--r4:22px;
  --sh:0 4px 20px -2px rgba(0,0,0,.4), 0 2px 8px -1px rgba(0,0,0,.2);
  --sh2:0 12px 40px -4px rgba(0,0,0,.6), 0 4px 16px -2px rgba(0,0,0,.3);
  --font:'Outfit',sans-serif;--font-display:'Playfair Display',serif;
  --sidebar-w:220px;
  --trans:all .22s cubic-bezier(0.4, 0, 0.2, 1);
  --org-line:rgba(255,255,255,.16);
  /* accent color slot — overridden by JS */
  --dyn-accent:#5b82f6;--dyn-accent2:#906ef5;
}
[data-theme="light"]{
  --bg:#f8fafc;--surface:#ffffff;--surface2:#f1f5f9;--surface3:#e2e8f0;
  --border:rgba(15,23,42,.05);--border2:rgba(15,23,42,.09);
  --text:#0f172a;--text2:#475569;--text3:#64748b;
  --sh:0 4px 12px rgba(15,23,42,.04);--sh2:0 16px 36px rgba(15,23,42,.08);
  --org-line:rgba(15,23,42,.12);
}
[data-theme="light"] .home-card{background:var(--surface);border-color:var(--border2);box-shadow:var(--sh)}
[data-theme="light"] .home-card:hover{border-color:rgba(91,130,246,.35);box-shadow:0 10px 28px rgba(91,130,246,.08)}
[data-theme="light"] .home-card::before{background:linear-gradient(135deg,rgba(91,130,246,.02),rgba(144,110,245,.02))}
[data-theme="light"] .home-tool-card{background:var(--surface);border-color:var(--border2);box-shadow:var(--sh)}
[data-theme="light"] .home-tool-card:hover{border-color:rgba(91,130,246,.3);background:rgba(91,130,246,.03);box-shadow:0 4px 12px rgba(91,130,246,.04)}
[data-theme="light"] .home-grid-bg{background-image:linear-gradient(rgba(15,23,42,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,.015) 1px,transparent 1px)}
[data-show-rank-icons="false"] .r-icon{display:none}
[data-compact="true"] td,[data-compact="true"] th{padding:6px 10px!important}
html{font-size:15px}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button,input,select,textarea{font-family:var(--font)}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
#root{min-height:100vh}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r);font-size:.82rem;font-weight:500;border:none;transition:var(--trans);white-space:nowrap;letter-spacing:.01em;user-select:none}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 12px rgba(91,130,246,.2)}
.btn-primary:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 6px 16px rgba(91,130,246,.3)}
.btn-gold{background:linear-gradient(135deg,var(--gold),#ca8a04);color:#07090e;font-weight:600}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(223,170,50,.25)}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--text2);border:1px solid var(--border2)}
.btn-ghost:hover{background:rgba(255,255,255,.08);color:var(--text);border-color:rgba(255,255,255,.15)}
.btn-outline{background:transparent;color:var(--text2);border:1px solid var(--border2)}
.btn-outline:hover{background:var(--surface2);color:var(--text);border-color:rgba(255,255,255,.15)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(248,113,113,.15)}
.btn-danger:hover{background:rgba(248,113,113,.2);transform:translateY(-1px)}
.btn-dark{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}
.btn-dark:hover{background:var(--surface3)}
.btn-sm{padding:6px 14px;font-size:.78rem}
.btn-xs{padding:4.5px 10px;font-size:.73rem;border-radius:7px}

/* ── CARDS ── */
.card{background:var(--surface);border-radius:var(--r3);border:1px solid var(--border);box-shadow:var(--sh);overflow:hidden;transition:var(--trans)}
.card-pad{padding:24px}

/* ── STAT CHIPS ── */
.stat-grid{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.stat-chip{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:12px 16px;display:flex;align-items:center;gap:10px;flex:1;min-width:115px;box-shadow:var(--sh);transition:var(--trans)}
.stat-chip:hover{transform:translateY(-2px);border-color:var(--border2)}
.stat-chip-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.88rem;flex-shrink:0}
.stat-chip-val{font-size:1.2rem;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.stat-chip-lbl{font-size:.62rem;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;font-weight:600}

/* ── TOOLBAR ── */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-wrap{flex:1;min-width:150px;position:relative}
.search-wrap input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--border2);border-radius:var(--r);font-size:.84rem;background:var(--surface2);color:var(--text);outline:none;transition:var(--trans)}
.search-wrap input::placeholder{color:var(--text3)}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,130,246,.15);background:var(--surface3)}
.search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:.82rem;pointer-events:none}
.filter-sel{padding:9px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:.82rem;background:var(--surface2);color:var(--text);outline:none;cursor:pointer;transition:var(--trans)}
.filter-sel:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,130,246,.15)}
.filter-sel option{background:var(--surface)}

/* ── FORM ── */
.fg{display:flex;flex-direction:column;gap:6px}
.fg label{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text3)}
.fg input,.fg select,.fg textarea{padding:9px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:.875rem;background:var(--surface2);color:var(--text);outline:none;transition:var(--trans)}
.fg input::placeholder{color:var(--text3)}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,130,246,.15);background:var(--surface3);font-weight:600}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);font-weight:700;padding:11px 16px;text-align:left;border-bottom:1px solid var(--border);background:var(--surface2);white-space:nowrap;position:sticky;top:0;z-index:2}
td{padding:12px 16px;font-size:.83rem;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text);transition:background .15s}
tr:last-child td{border-bottom:none}
tr{transition:var(--trans)}
tr:hover td{background:rgba(91,130,246,.03)}
.tr-click{cursor:pointer}
.tr-click:hover td{background:rgba(91,130,246,.065)!important}

/* ── SORT HEADER ── */
.th-sort{cursor:pointer;user-select:none;transition:color .15s}
.th-sort:hover{color:var(--text2)}
.th-sort.asc::after{content:' ↑'}
.th-sort.desc::after{content:' ↓'}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:2.5px 9px;border-radius:20px;font-size:.66rem;font-weight:600;white-space:nowrap;letter-spacing:.02em;border:1px solid transparent;transition:var(--trans)}
.b-gold{background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold-border)}
.b-green{background:var(--green-bg);color:var(--green);border-color:rgba(52,211,153,.15)}
.b-red{background:var(--red-bg);color:var(--red);border-color:rgba(248,113,113,.15)}
.b-blue{background:var(--blue-bg);color:var(--blue);border-color:rgba(96,165,250,.15)}
.b-purple{background:var(--purple-bg);color:var(--purple);border-color:rgba(192,132,252,.15)}
.b-magenta{background:var(--magenta-bg);color:var(--magenta);border-color:rgba(244,114,182,.15)}
.b-ex{background:var(--ex-bg);color:var(--ex);border:1px solid rgba(239,68,68,.2)}
.b-orange{background:var(--orange-bg);color:var(--orange);border-color:rgba(251,146,60,.15)}
.b-gray{background:rgba(255,255,255,.04);color:var(--text2);border-color:var(--border2)}
.b-navy{background:rgba(96,165,250,.1);color:#90bbff;border-color:rgba(96,165,250,.18)}
.b-eng{background:rgba(91,130,246,.07);color:#7ea5ff;border-color:rgba(91,130,246,.18)}
.b-ind{background:rgba(251,146,60,.07);color:#ff9f5e;border-color:rgba(251,146,60,.18)}
.b-flex{background:var(--magenta-bg);color:var(--magenta);border-color:rgba(244,114,182,.15)}

/* ── RANK ── */
.r-ace{background:linear-gradient(135deg,rgba(223,170,50,.12),rgba(223,170,50,.04));color:var(--gold);border:1px solid var(--gold-border);padding:2px 8px;border-radius:20px;font-size:.67rem;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.r-troop{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(96,165,250,.18);padding:2px 8px;border-radius:20px;font-size:.67rem;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.r-trainee{background:rgba(255,255,255,.04);color:var(--text2);border:1px solid var(--border2);padding:2px 8px;border-radius:20px;font-size:.67rem;font-weight:700;display:inline-flex;align-items:center;gap:3px}

.fg select option{background:var(--surface)}
.fg textarea{resize:vertical;min-height:60px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.span2{grid-column:1/-1}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:300;padding:12px;backdrop-filter:blur(6px)}
.modal{background:var(--surface);border-radius:var(--r4);border:1px solid var(--border2);padding:24px;width:100%;max-width:680px;max-height:94vh;overflow-y:auto;box-shadow:var(--sh2)}
.modal-wide{max-width:860px}
.modal-sm{max-width:480px}
.m-title{font-size:1.05rem;font-weight:700;color:var(--text);margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.m-close{background:none;border:none;color:var(--text3);font-size:1.2rem;cursor:pointer;padding:2px 6px;border-radius:6px;line-height:1}
.m-close:hover{color:var(--text);background:var(--surface2)}
.m-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:14px;border-top:1px solid var(--border)}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface2);color:var(--text);padding:11px 16px;border-radius:var(--r2);font-size:.82rem;z-index:1000;display:flex;align-items:center;gap:9px;box-shadow:var(--sh2);border:1px solid var(--border2);animation:tup .2s ease;max-width:calc(100vw - 40px)}
.toast.ok{border-left:3px solid var(--green)}
.toast.err{border-left:3px solid var(--red)}
@keyframes tup{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── SPINNER ── */
.spin{width:24px;height:24px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-pg{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg)}
.loading-pg p{color:var(--text3);font-size:.875rem}
.loading-pg .spin{width:34px;height:34px;border-width:2.5px}
.data-loading{display:flex;align-items:center;justify-content:center;padding:50px;gap:12px;color:var(--text3);font-size:.875rem}

/* ── HOME ── */
.home{min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.home-mesh{position:absolute;inset:0;pointer-events:none}
.home-mesh::before{content:'';position:absolute;top:-20%;right:-10%;width:55%;height:70%;background:radial-gradient(ellipse,rgba(108,143,255,.08) 0%,transparent 70%)}
.home-mesh::after{content:'';position:absolute;bottom:-10%;left:-5%;width:50%;height:50%;background:radial-gradient(ellipse,rgba(167,139,250,.07) 0%,transparent 70%)}
.home-grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.home-nav{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;position:relative;z-index:2}
.home-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center;position:relative;z-index:2}
.home-emblem{width:84px;height:84px;border-radius:20px;background:linear-gradient(135deg,rgba(108,143,255,.15),rgba(167,139,250,.15));border:1px solid rgba(108,143,255,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;overflow:hidden}
.home-emblem img{width:100%;height:100%;object-fit:cover;border-radius:20px}
.home-emblem-ph{font-family:var(--font-display);font-size:1.6rem;color:var(--accent);font-weight:700}
.home-eyebrow{font-size:.68rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.home-title{font-family:var(--font-display);font-size:2.8rem;color:var(--text);margin-bottom:12px;line-height:1.1}
.home-title span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.home-desc{font-size:.88rem;color:var(--text2);max-width:400px;line-height:1.8;margin:0 auto 44px}
.home-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:700px;width:100%}
.home-card{background:rgba(255,255,255,.03);border:1px solid var(--border2);border-radius:var(--r3);padding:22px 18px;cursor:pointer;transition:all .2s;text-align:center;position:relative;overflow:hidden}
.home-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(108,143,255,.05),rgba(167,139,250,.05));opacity:0;transition:opacity .2s}
.home-card:hover{border-color:rgba(108,143,255,.35);transform:translateY(-3px);box-shadow:0 10px 28px rgba(108,143,255,.14)}
.home-card:hover::before{opacity:1}
.home-card-icon{font-size:1.5rem;margin-bottom:10px}
.home-card-title{font-size:.92rem;font-weight:700;color:var(--text);margin-bottom:5px}
.home-card-desc{font-size:.73rem;color:var(--text3);line-height:1.6}
.home-tool-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.08);border-radius:var(--r2);padding:14px 16px;cursor:pointer;transition:all .2s;text-align:center;text-decoration:none;display:flex;flex-direction:column;align-items:center}
.home-tool-card:hover{border-color:rgba(108,143,255,.3);background:rgba(108,143,255,.06);transform:translateY(-2px)}
.home-tool-icon{font-size:1.2rem;margin-bottom:6px}
.home-tool-title{font-size:.78rem;font-weight:600;color:var(--text);margin-bottom:3px}
.home-tool-desc{font-size:.64rem;color:var(--text3);line-height:1.5}
.home-footer{padding:14px 32px;text-align:center;font-size:.63rem;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;position:relative;z-index:2}

/* ── PUBLIC HEADER ── */
.pub-header{background:var(--surface);border-bottom:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;z-index:50}
.pub-topbar{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:50px}
.pub-brand{display:flex;align-items:center;gap:9px;cursor:pointer;min-width:0}
.brand-icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.brand-icon img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.brand-icon-ph{font-family:var(--font-display);font-size:.82rem;color:#fff;font-weight:700}
.brand-name{font-weight:700;font-size:.87rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:.58rem;color:var(--text3);letter-spacing:.06em;text-transform:uppercase}
.tab-strip{display:flex;padding:0 12px;gap:0;overflow-x:auto;scrollbar-width:none}
.tab-strip::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;font-size:.78rem;font-weight:500;color:var(--text3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .18s;white-space:nowrap}
.tab:hover{color:var(--text2)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.pub-content{padding:16px;flex:1}

/* ── PAGE HEADER ── */
.pg-head{margin-bottom:16px}
.pg-head h2{font-size:1.15rem;font-weight:700;color:var(--text);margin-bottom:2px}
.pg-head p{color:var(--text3);font-size:.78rem}

/* ── ADMIN LAYOUT ── */
.admin-wrap{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto}
.sb-brand{padding:16px 14px 12px;border-bottom:1px solid var(--border)}
.sb-nav{flex:1;padding:10px 8px;overflow-y:auto}
.sb-section{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:10px 10px 5px;margin-top:4px}
.sb-item{display:flex;align-items:center;gap:9px;padding:9px 10px;font-size:.81rem;color:var(--text2);cursor:pointer;transition:all .15s;border-radius:var(--r);margin-bottom:1px;font-weight:500}
.sb-item:hover{color:var(--text);background:rgba(255,255,255,.05)}
.sb-item.on{color:var(--accent);background:rgba(108,143,255,.1)}
.sb-icon{font-size:.92rem;width:18px;text-align:center;flex-shrink:0}
.sb-foot{padding:10px 8px;border-top:1px solid var(--border)}
.admin-main{margin-left:var(--sidebar-w);flex:1;background:var(--bg);min-height:100vh;overflow:auto}
.admin-content{padding:20px}

/* ── SETTINGS ── */
.settings-grid{display:grid;grid-template-columns:1fr;gap:14px;max-width:680px}
.settings-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r3);padding:20px}
.settings-card-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.settings-card-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0}
.settings-card-title{font-size:.88rem;font-weight:700;color:var(--text);margin-bottom:2px}
.settings-card-desc{font-size:.73rem;color:var(--text3)}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);gap:12px}
.settings-row:last-child{border-bottom:none;padding-bottom:0}
.settings-row-label{font-size:.82rem;font-weight:500;color:var(--text);flex:1;min-width:0}
.settings-row-sub{font-size:.71rem;color:var(--text3);margin-top:2px}
.settings-row-ctrl{flex-shrink:0}

/* ── TOGGLE ── */
.toggle{position:relative;width:40px;height:22px;flex-shrink:0;display:inline-block}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;border-radius:11px;background:var(--surface3);border:1px solid var(--border2);transition:background .2s;cursor:pointer}
.toggle input:checked+.toggle-track{background:var(--accent);border-color:transparent}
.toggle-thumb{position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s;pointer-events:none}
.toggle input:checked~.toggle-thumb{transform:translateX(18px)}

/* ── COLOR PICKER ── */
.color-chips{display:flex;gap:6px;flex-wrap:wrap}
.color-chip{width:26px;height:26px;border-radius:50%;cursor:pointer;transition:transform .15s,box-shadow .15s;border:2px solid transparent}
.color-chip.on{border-color:#fff;transform:scale(1.15);box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.color-chip:hover{transform:scale(1.1)}

/* ── DRAG ── */
.drag-row{cursor:grab}
.drag-row:active{cursor:grabbing}
.drag-handle{color:var(--text3);font-size:1rem;cursor:grab;user-select:none;padding:0 2px}
.drag-over td{border-top:2px solid var(--accent)!important}

/* ── DASHBOARD ── */
.dash-stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:700px){.dash-stat-grid{grid-template-columns:repeat(4,1fr)}}
.dash-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r3);padding:16px 18px;position:relative;overflow:hidden}
.dash-card-stripe{position:absolute;top:0;left:0;right:0;height:2px}
.dash-num{font-size:1.9rem;font-weight:800;line-height:1;letter-spacing:-.04em;margin-bottom:3px}
.dash-lbl{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);font-weight:600}
.dash-sub{font-size:.7rem;color:var(--text3);margin-top:2px}
.progress-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.progress-bar{flex:1;height:5px;background:var(--surface3);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .5s}
.progress-lbl{font-size:.76rem;color:var(--text2);min-width:70px}
.progress-val{font-size:.74rem;font-weight:700;color:var(--text);min-width:20px;text-align:right}

/* ── PARTICIPANT PICKER ── */
.part-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:7px;max-height:240px;overflow-y:auto;padding:2px}
.part-item{border:1px solid var(--border2);border-radius:var(--r);padding:8px 10px;cursor:pointer;transition:all .15s;background:var(--surface2)}
.part-item.sel{border-color:var(--accent);background:rgba(108,143,255,.08)}
.part-name{font-size:.78rem;font-weight:600;margin-bottom:5px;color:var(--text)}
.part-roles{display:flex;gap:4px;flex-wrap:wrap}
.role-btn{font-size:.66rem;padding:2px 7px;border-radius:10px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s}
.role-btn.on{background:var(--accent);color:#fff;border-color:transparent}

/* ── RESULT ASSIGNMENT PER PERSON ── */
.per-person-result-wrap{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.ppr-row{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--surface2);border-radius:8px;border:1px solid var(--border)}
.ppr-name{font-size:.78rem;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ppr-role{font-size:.67rem;padding:1px 6px;border-radius:8px;border:1px solid var(--border2);color:var(--text3);flex-shrink:0}
.ppr-role.debater{background:var(--blue-bg);color:var(--blue);border-color:transparent}
.ppr-role.adjudicator{background:var(--purple-bg);color:var(--purple);border-color:transparent}
.ppr-input{flex:1;padding:4px 7px;border:1px solid var(--border2);border-radius:6px;font-size:.75rem;background:var(--surface);color:var(--text);outline:none;min-width:0}
.ppr-input:focus{border-color:var(--accent)}

/* ── RESULT TAGS ── */
.result-tags{display:flex;flex-wrap:wrap;gap:4px}
.result-tag{display:inline-flex;align-items:center;gap:4px;background:var(--green-bg);color:var(--green);border:1px solid rgba(52,211,153,.2);padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:600}
.result-tag button{background:none;border:none;color:inherit;cursor:pointer;font-size:.72rem;padding:0 0 0 2px;line-height:1}

/* ── CLASS CHIPS ── */
.class-chips{display:flex;flex-wrap:wrap;gap:6px}
.class-chip{padding:4px 12px;border-radius:20px;font-size:.73rem;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);transition:all .15s;user-select:none}
.class-chip.on{background:var(--accent);color:#fff;border-color:transparent}

/* ── LOGIN ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);position:relative;padding:16px}
.login-wrap::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:500px;height:500px;background:radial-gradient(ellipse,rgba(108,143,255,.06) 0%,transparent 70%);pointer-events:none}
.login-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r4);padding:32px;width:100%;max-width:360px;text-align:center;box-shadow:var(--sh2);position:relative;z-index:1}

/* ── LOGO ── */
.logo-icon{border-radius:9px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.logo-icon img{width:100%;height:100%;object-fit:cover}
.logo-icon-ph{font-family:var(--font-display);color:#fff;font-weight:700}
.logo-icon-bg{background:linear-gradient(135deg,var(--accent),var(--accent2))}

/* ── PROFILE MODAL ── */
.profile-section{margin-bottom:16px}
.profile-section-title{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:8px}
.profile-row{display:flex;gap:8px;margin-bottom:5px;align-items:flex-start}
.profile-key{font-size:.76rem;color:var(--text3);min-width:90px;flex-shrink:0;padding-top:2px}
.profile-val{font-size:.82rem;color:var(--text);font-weight:500;word-break:break-word}
.profile-comp-row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.profile-comp-row:last-child{border-bottom:none}
.profile-comp-code{font-size:.72rem;font-weight:700;color:var(--accent);min-width:80px;flex-shrink:0}
.profile-comp-name{font-size:.76rem;color:var(--text2);flex:1;min-width:0}
.profile-comp-result{font-size:.7rem;color:var(--green);font-weight:600}

/* ── MOBILE ── */
@media(max-width:640px){
  .home-cards{grid-template-columns:1fr}
  .home-title{font-size:2rem}
  .home-nav{padding:14px 16px}
  .home-body{padding:24px 16px}
  .home-desc{margin-bottom:32px}
  .g2{grid-template-columns:1fr}
  .g3{grid-template-columns:1fr 1fr}
  .admin-wrap{flex-direction:column}
  .sidebar{position:relative;width:100%;height:auto;border-right:none;border-bottom:1px solid var(--border)}
  .admin-main{margin-left:0}
  .sb-nav{display:flex;flex-wrap:wrap;padding:8px}
  .sb-section{display:none}
  .sb-item{padding:7px 10px;font-size:.76rem}
  .dash-stat-grid{grid-template-columns:repeat(2,1fr)}
  .settings-row{flex-direction:column;align-items:flex-start}
  .settings-row-ctrl{margin-top:6px}
  td,th{padding:7px 8px!important;font-size:.78rem!important}
  .pub-content{padding:12px}
  .stat-chip{min-width:90px;padding:8px 10px}
  .stat-chip-val{font-size:1rem}
  .modal{padding:16px;border-radius:14px}
  .part-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .per-person-result-wrap .ppr-name{font-size:.72rem}
}
@media(max-width:400px){
  .home-cards{grid-template-columns:1fr}
  .stat-grid{gap:7px}
  .g3{grid-template-columns:1fr}
}

/* ── LIGHT MODE FIXES ── */
[data-theme="light"] .filter-sel,[data-theme="light"] .search-wrap input{background:#fff;color:var(--text);border-color:var(--border2)}
[data-theme="light"] .fg input,[data-theme="light"] .fg select,[data-theme="light"] .fg textarea{background:#fff;border-color:var(--border2);color:var(--text)}
[data-theme="light"] .modal{background:#fff;border-color:var(--border2)}
[data-theme="light"] .part-item{background:var(--surface2)}
[data-theme="light"] .ppr-row{background:var(--surface2)}
[data-theme="light"] .part-list{background:#fff}
[data-theme="light"] .part-list-item:hover{background:var(--surface2)}
[data-theme="light"] .toggle-track{background:#e2e8f0;border-color:#cbd5e1}
[data-theme="light"] .btn-ghost{background:rgba(15,23,42,.03);color:var(--text2);border-color:var(--border2)}
[data-theme="light"] .btn-ghost:hover{background:rgba(15,23,42,.06);color:var(--text)}
[data-theme="light"] .home-grid-bg{background-image:linear-gradient(rgba(15,23,42,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,.03) 1px,transparent 1px)}
[data-theme="light"] .home-card{background:#ffffff;border-color:var(--border2);box-shadow:var(--sh)}
[data-theme="light"] .home-card:hover{border-color:var(--accent);box-shadow:0 10px 28px rgba(91,130,246,.08)}
[data-theme="light"] .home-tool-card{background:#ffffff;border-color:var(--border2);box-shadow:var(--sh)}
[data-theme="light"] .home-tool-card:hover{background:var(--surface2);border-color:var(--accent)}
[data-theme="light"] .home-emblem{background:linear-gradient(135deg,rgba(91,130,246,.08),rgba(144,110,245,.08));border-color:rgba(91,130,246,.2)}
[data-theme="light"] .login-wrap{background:var(--bg)}
[data-theme="light"] .stat-chip,[data-theme="light"] .card,[data-theme="light"] .dash-card{background:#fff;box-shadow:0 4px 12px rgba(15,23,42,.03);border-color:var(--border)}
[data-theme="light"] .org-node{background:#fff;border-color:var(--border2)}
[data-theme="light"] .org-node.n3{background:#fff}
[data-theme="light"] .org-node:hover{box-shadow:0 8px 24px rgba(15,23,42,.06)}

/* ── PARTICIPANT SEARCH ── */
.part-search-wrap{position:relative;margin-bottom:8px}
.part-search-wrap input{width:100%;padding:7px 12px 7px 30px;border:1px solid var(--border2);border-radius:var(--r);font-size:.83rem;background:var(--surface2);color:var(--text);outline:none;transition:border-color .14s}
.part-search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(108,143,255,.12)}
.part-search-ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:.75rem;pointer-events:none}
.part-tabs{display:flex;gap:0;margin-bottom:8px;border-bottom:1px solid var(--border)}
.part-tab{padding:5px 12px;font-size:.75rem;font-weight:500;color:var(--text3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.part-tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.part-selected-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;min-height:24px;padding:2px 0}
.part-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:.71rem;font-weight:600;cursor:default}
.part-chip.deb{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(96,165,250,.2)}
.part-chip.adj{background:var(--purple-bg);color:var(--purple);border:1px solid rgba(192,132,252,.2)}
.part-chip-x{background:none;border:none;color:inherit;cursor:pointer;font-size:.8rem;padding:0 0 0 2px;opacity:.6;line-height:1}
.part-chip-x:hover{opacity:1}
.part-list-box{max-height:210px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
.part-list-item{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;border-bottom:.5px solid var(--border);transition:background .1s}
.part-list-item:last-child{border-bottom:none}
.part-list-item:hover{background:var(--surface2)}
.part-list-name{font-size:.82rem;font-weight:500;flex:1}
.part-list-meta{font-size:.68rem;color:var(--text3);margin-top:1px}
.part-list-roles{display:flex;gap:4px;flex-shrink:0}

/* ── ORG TREE ── */
.org-wrap{padding:20px 16px 32px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.org-canvas{display:flex;flex-direction:column;align-items:center;width:fit-content;min-width:520px;margin:0 auto}

/* Node card */
.org-node{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r2);padding:14px 12px 10px;text-align:center;position:relative;transition:var(--trans);cursor:default;box-sizing:border-box;flex-shrink:0}
.org-node:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--accent);z-index:10}
.org-node.n1{width:176px;border-color:var(--gold-border);background:linear-gradient(160deg,rgba(223,170,50,.07),rgba(223,170,50,.01))}
.org-node.n1:hover{border-color:var(--gold);box-shadow:0 6px 20px rgba(223,170,50,.15)}
.org-node.n2{width:164px;border-color:rgba(91,130,246,.25);background:linear-gradient(160deg,rgba(91,130,246,.05),transparent)}
.org-node.n2:hover{border-color:var(--accent);box-shadow:0 6px 20px rgba(91,130,246,.15)}
.org-node.n3{width:150px;border-color:var(--border2);background:var(--surface2)}
.org-node.n3:hover{border-color:var(--accent);box-shadow:0 6px 20px rgba(91,130,246,.15)}

.org-ava{width:54px;height:54px;border-radius:50%;margin:0 auto 8px;overflow:hidden;border:2.5px solid var(--border2);background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:1.2rem;transition:var(--trans)}
.org-node.n1 .org-ava{width:62px;height:62px;border-color:var(--gold);box-shadow:0 0 12px rgba(223,170,50,.15)}
.org-node.n2 .org-ava{border-color:var(--accent);box-shadow:0 0 12px rgba(91,130,246,.15)}
.org-ava img{width:100%;height:100%;object-fit:cover}
.org-pos{font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.org-node.n1 .org-pos{color:var(--gold)}
.org-node.n2 .org-pos{color:var(--accent)}
.org-node.n3 .org-pos{color:var(--text3)}
.org-nm{font-size:.77rem;font-weight:700;color:var(--text);line-height:1.2;margin-bottom:5px}
.org-node.n1 .org-nm{font-size:.84rem}
.org-badges{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}

/* Dept label */
.org-dept-lbl{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);padding:2px 9px;background:var(--surface2);border-radius:20px;border:1px solid var(--border);margin-bottom:6px}

/* Tooltip */
.org-tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:var(--surface3);border:1px solid var(--border2);border-radius:var(--r2);padding:10px 13px;font-size:.72rem;white-space:nowrap;z-index:50;box-shadow:var(--sh2);pointer-events:none;opacity:0;transition:opacity .14s;min-width:160px}
.org-node:hover .org-tip{opacity:1}
.org-tip-row{display:flex;gap:8px;margin-bottom:3px}
.org-tip-row:last-child{margin-bottom:0}
.org-tip-k{color:var(--text3);min-width:60px;font-size:.7rem}
.org-tip-v{color:var(--text);font-weight:600}

/* Row spacing */
.org-row{display:flex;justify-content:center;align-items:flex-start;gap:24px}
.org-vgap{height:36px;width:2px;background:var(--org-line);margin:0 auto}
.org-vgap-sm{height:20px;width:2px;background:var(--org-line);margin:0 auto}

/* H-connector built via SVG inline */
.org-hcon{display:block;overflow:visible}

@media(max-width:768px){
  .org-canvas{min-width:620px}
  .org-node.n1{width:155px}
  .org-node.n2{width:145px}
  .org-node.n3{width:132px}
  .org-ava{width:46px;height:46px}
  .org-node.n1 .org-ava{width:54px;height:54px}
}

/* ── HALL OF FAME ── */
.hof-wrap{padding:24px}
.hof-header{text-align:center;margin-bottom:36px}
.hof-deco{font-size:.66rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.hof-title{font-family:'Playfair Display',serif;font-size:2rem;color:var(--text);margin-bottom:6px}
.hof-sub{font-size:.82rem;color:var(--text2)}
.hof-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.hof-card{background:var(--surface);border:1px solid var(--gold-border);border-radius:var(--r3);overflow:hidden;position:relative;transition:var(--trans)}
.hof-card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(223,170,50,.12);border-color:var(--gold)}
.hof-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold))}
.hof-card-top{background:linear-gradient(135deg,rgba(223,170,50,.08),rgba(223,170,50,.01));padding:24px 20px;text-align:center}
.hof-avatar{width:80px;height:80px;border-radius:50%;margin:0 auto 12px;overflow:hidden;border:2.5px solid var(--gold);background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:1.6rem;transition:var(--trans);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.hof-card:hover .hof-avatar{transform:scale(1.05);box-shadow:0 0 16px rgba(223,170,50,.25)}
.hof-avatar img{width:100%;height:100%;object-fit:cover}
.hof-award{display:inline-flex;padding:3.5px 12px;background:var(--gold-dim);border:1px solid var(--gold-border);border-radius:20px;font-size:.68rem;font-weight:700;color:var(--gold);margin-bottom:8px;letter-spacing:.03em;text-transform:uppercase}
.hof-name{font-size:1rem;font-weight:700;color:var(--text)}
.hof-card-body{padding:16px 20px;background:rgba(255,255,255,.01)}
.hof-desc{font-size:.82rem;color:var(--text2);line-height:1.75}
.hof-year{font-size:.67rem;color:var(--text3);margin-top:8px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.hof-empty{text-align:center;padding:60px 20px;color:var(--text3)}
.hof-empty-ico{font-size:2.5rem;margin-bottom:12px;opacity:.4}

/* ── INFO PAGE ── */
.info-wrap{padding:24px;max-width:860px}
.info-sec{margin-bottom:32px}
.info-sec-title{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--text);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.info-org{display:flex;align-items:flex-start;gap:18px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r3);margin-bottom:12px}
.info-org-logo{width:58px;height:58px;border-radius:12px;flex-shrink:0;overflow:hidden;background:var(--surface3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--accent)}
.info-org-logo img{width:100%;height:100%;object-fit:cover}
.info-org-title{font-weight:700;font-size:.9rem;margin-bottom:4px}
.info-org-text{font-size:.82rem;color:var(--text2);line-height:1.7}
.info-role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px}
.info-role-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:12px 14px}
.info-role-title{font-size:.8rem;font-weight:700;color:var(--text);margin-bottom:4px}
.info-role-desc{font-size:.74rem;color:var(--text3);line-height:1.6}
.info-rank-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px;margin-bottom:9px;border-left:3px solid transparent}
.info-rank-card.ace{border-left-color:var(--gold)}
.info-rank-card.troop{border-left-color:var(--blue)}
.info-rank-card.trainee{border-left-color:var(--text3)}
.info-rank-name{font-size:.88rem;font-weight:700;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.info-rank-desc{font-size:.78rem;color:var(--text2);line-height:1.7;margin-bottom:7px}
.info-rank-reqs{padding-left:0}
.info-rank-req{font-size:.76rem;color:var(--text3);margin-bottom:4px;padding-left:14px;position:relative;list-style:none}
.info-rank-req::before{content:'›';position:absolute;left:2px;color:var(--accent)}

function exportToExcel(sheetData, sheetName, fileName) {
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(sheetData);
  // Auto column widths
  const colWidths = sheetData[0].map((_, ci) => ({
    wch: Math.min(50, Math.max(10, ...sheetData.map(r => String(r[ci]||'').length)))
  }));
  ws['!cols'] = colWidths;
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, fileName);
}

// ─── TOAST ───────────────────────────────────────────────────────────────────
function Toast({ msg, type, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 3000); return () => clearTimeout(t); }, []);
  return <div className={`toast ${type==='success'?'ok':'err'}`}>{type==='success'?'✓':'✕'} {msg}</div>;
}
function useToast() {
  const [t, setT] = useState(null);
  const show = (msg, type='success') => setT({ msg, type, k: Date.now() });
  const el = t && <Toast key={t.k} msg={t.msg} type={t.type} onDone={()=>setT(null)} />;
  return [show, el];
}

function Modal({ title, onClose, children, wide, sm }) {
  useEffect(() => {
    const fn = e => { if (e.key==='Escape') onClose(); };
    document.addEventListener('keydown', fn);
    return () => document.removeEventListener('keydown', fn);
  }, []);
  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className={`modal ${wide?'modal-wide':''} ${sm?'modal-sm':''}`}>
        <div className="m-title">

          <button className="m-close" onClick={onClose}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

// ─── DRAG REORDER ────────────────────────────────────────────────────────────
function useDragReorder(items, setItems, onSaveOrder) {
  const dragIdx = useRef(null);
  const [overIdx, setOverIdx] = useState(null);
  const onDragStart = (e,i) => { dragIdx.current=i; e.dataTransfer.effectAllowed='move'; };
  const onDragOver = (e,i) => { e.preventDefault(); setOverIdx(i); };
  const onDrop = (e,i) => {
    e.preventDefault();
    if (dragIdx.current===null||dragIdx.current===i){setOverIdx(null);return;}
    const arr=[...items]; const [m]=arr.splice(dragIdx.current,1); arr.splice(i,0,m);
    setItems(arr); onSaveOrder(arr); dragIdx.current=null; setOverIdx(null);
  };
  const onDragEnd = () => { dragIdx.current=null; setOverIdx(null); };
  return { onDragStart, onDragOver, onDrop, onDragEnd, isDragOver:i=>overIdx===i };
}

  const [settings, setSettings] = useState(defaults);

      const map = {};
      data.forEach(r => { try { map[r.key] = JSON.parse(r.value); } catch { map[r.key] = r.value; } });

}

// ─── DEBATERS TAB ─────────────────────────────────────────────────────────────
function DebatersTab({ members, loading, settings = {}, competitions }) {
  const [search, setSearch] = useState('');
  const [fDiv, setFDiv] = useState('All');
  const [fRank, setFRank] = useState('All');
  const [sortField, setSortField] = useState(null); // 'comps'|'rounds'|'breaks'
  const [sortDir, setSortDir] = useState('desc');
  const [profile, setProfile] = useState(null);

  const toggleSort = field => {
    if (sortField===field && sortDir==='asc') { setSortField(null); setSortDir('desc'); } // third click = reset
    else if (sortField===field) setSortDir(d=>d==='desc'?'asc':'desc');
    else { setSortField(field); setSortDir('desc'); }
  };

  const sorted = useMemo(() => {
    let arr = members.filter(m=>{
      const s=search.toLowerCase();
      return (!s||m.full_name?.toLowerCase().includes(s))
        && (fDiv==='All'||m.division===fDiv)
        && (fRank==='All'||m.rank===fRank);
    });
    if (sortField) {
      const key = sortField==='comps'?'total_competitions':sortField==='rounds'?'total_rounds':'total_breaking';
      arr = [...arr].sort((a,b)=>sortDir==='desc'?(b[key]||0)-(a[key]||0):(a[key]||0)-(b[key]||0));
    }
    return arr;
  }, [members, search, fDiv, fRank, sortField, sortDir]);

  const itemsPerPage = settings.items_per_page === 'All' ? Infinity : parseInt(settings.items_per_page || '50', 10);
  const [page, setPage] = useState(1);

  // Reset page when filters change
  useEffect(() => {
    setPage(1);
  }, [search, fDiv, fRank, itemsPerPage]);

  const totalPages = Math.ceil(sorted.length / itemsPerPage);
  const paginatedData = useMemo(() => {
    if (itemsPerPage === Infinity) return sorted;
    const start = (page - 1) * itemsPerPage;
    return sorted.slice(start, start + itemsPerPage);
  }, [sorted, page, itemsPerPage]);

  const counts = { total:members.length, ace:members.filter(m=>m.rank==='Ace').length, troop:members.filter(m=>m.rank==='Troop').length, trainee:members.filter(m=>m.rank==='Trainee').length };

      <div className="toolbar">
        {settings.allow_public_search !== false ? (
          <div className="search-wrap">

          </div>

        <select className="filter-sel" value={fDiv} onChange={e=>setFDiv(e.target.value)}>{['All','English','Indonesia','Flex'].map(o=><option key={o}>{o}</option>)}</select>
        <select className="filter-sel" value={fRank} onChange={e=>setFRank(e.target.value)}>{['All','Ace','Troop','Trainee'].map(o=><option key={o}>{o}</option>)}</select>

      </div>

      <div className="card">
        <div className="tbl-wrap">
          {loading ? <div className="data-loading"><div className="spin"/><span>Loading…</span></div> : (
            <table>
              <thead>
                <tr>

// ─── PUBLIC DASHBOARD ─────────────────────────────────────────────────────────
function PublicDashboard({ members, competitions, loading }) {
  if (loading) return <div className="data-loading"><div className="spin"/><span>Loading stats…</span></div>;

  const nonAlumni = members.filter(m=>!m.classes?.includes('Alumni')&&!m.classes?.includes('Ex'));
  const active = nonAlumni.filter(m=>m.active_status==='Active');
  const totalRounds = members.reduce((s,m)=>s+(m.total_rounds||0),0);
  const totalBreaks = members.reduce((s,m)=>s+(m.total_breaking||0),0);
  const byDiv = { English:members.filter(m=>m.division==='English').length, Indonesia:members.filter(m=>m.division==='Indonesia').length, Flex:members.filter(m=>m.division==='Flex').length };
  const byRank = { Ace:nonAlumni.filter(m=>m.rank==='Ace').length, Troop:nonAlumni.filter(m=>m.rank==='Troop').length, Trainee:nonAlumni.filter(m=>m.rank==='Trainee').length };
  const topRounds = [...members].sort((a,b)=>(b.total_rounds||0)-(a.total_rounds||0)).slice(0,10);
  const topBreaks = [...members].sort((a,b)=>(b.total_breaking||0)-(a.total_breaking||0)).slice(0,10);
  const byLevel = {}; competitions.forEach(c=>{byLevel[c.level]=(byLevel[c.level]||0)+1;});
  const maxDiv = Math.max(...Object.values(byDiv), 1);
  const maxRank = Math.max(...Object.values(byRank), 1);

  return (
    <div className="pub-content">
      <div className="pg-head">
        <h2>Stats & Overview</h2>
        <p>EDS UNIMA at a glance — {members.length} members · {competitions.length} competitions</p>

      {/* Key numbers */}
      <div className="dash-stat-grid" style={{gridTemplateColumns:'repeat(2,1fr)',marginBottom:16}}>
        {[

          ['Total Rounds', totalRounds, `avg ${members.length?Math.round(totalRounds/members.length):0} per member`, 'var(--green)'],
          ['Total Breaks', totalBreaks, `${members.length?Math.round(totalBreaks/members.length*10)/10:0} avg per member`, 'var(--accent2)'],
        ].map(([l,v,sub,c])=>(
          <div key={l} className="dash-card">
            <div className="dash-card-stripe" style={{background:c}}/>
            <div className="dash-num" style={{color:c}}>{v}</div>
            <div className="dash-lbl">{l}</div>
            <div className="dash-sub">{sub}</div>
          </div>
        ))}
      </div>

      {/* Division & Rank bars */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:12,marginBottom:12}}>
        <div className="card card-pad">
          <div style={{fontWeight:700,marginBottom:14,fontSize:'.88rem'}}>Members by Division</div>
          {Object.entries(byDiv).map(([d,v])=>(
            <div key={d} className="progress-row">
              <div className="progress-lbl"><DivBadge div={d}/></div>
              <div className="progress-bar"><div className="progress-fill" style={{width:`${v/maxDiv*100}%`,background:'var(--accent)'}}/></div>
              <div className="progress-val">{v}</div>
            </div>
          ))}
        </div>
        <div className="card card-pad">
          <div style={{fontWeight:700,marginBottom:14,fontSize:'.88rem'}}>Members by Rank</div>
          {Object.entries(byRank).map(([r,v])=>(
            <div key={r} className="progress-row">
              <div className="progress-lbl"><RankBadge rank={r}/></div>
              <div className="progress-bar"><div className="progress-fill" style={{width:`${v/maxRank*100}%`,background:r==='Ace'?'var(--gold)':r==='Troop'?'var(--blue)':'var(--text3)'}}/></div>
              <div className="progress-val">{v}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Top 10 leaderboards */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:12,marginBottom:12}}>
        <div className="card card-pad">
          <div style={{fontWeight:700,marginBottom:12,fontSize:'.88rem'}}>🏅 Top 10 — Rounds</div>
          <table>
            <thead><tr><th>#</th><th>Name</th><th>Div</th><th style={{textAlign:'center'}}>Rounds</th></tr></thead>
            <tbody>
              {topRounds.map((m,i)=>(
                <tr key={m.id}>
                  <td style={{fontWeight:700,color:i===0?'var(--gold)':i<3?'var(--text2)':'var(--text3)',fontSize:'.72rem'}}>{i+1}</td>
                  <td style={{fontSize:'.82rem',fontWeight:i===0?700:400}}>{m.full_name}</td>

                  <td style={{fontWeight:700,color:'var(--accent)',textAlign:'center'}}>{m.total_rounds||0}</td>
                </tr>

            </tbody>
          </table>
        </div>
        <div className="card card-pad">
          <div style={{fontWeight:700,marginBottom:12,fontSize:'.88rem'}}>🏅 Top 10 — Breaks</div>
          <table>
            <thead><tr><th>#</th><th>Name</th><th>Div</th><th style={{textAlign:'center'}}>Breaks</th></tr></thead>
            <tbody>
              {topBreaks.map((m,i)=>(
                <tr key={m.id}>
                  <td style={{fontWeight:700,color:i===0?'var(--gold)':i<3?'var(--text2)':'var(--text3)',fontSize:'.72rem'}}>{i+1}</td>
                  <td style={{fontSize:'.82rem',fontWeight:i===0?700:400}}>{m.full_name}</td>
                  <td><DivBadge div={m.division}/></td>
                  <td style={{fontWeight:700,color:'var(--gold)',textAlign:'center'}}>{m.total_breaking||0}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* Competitions by level */}
      {Object.keys(byLevel).length > 0 && (
        <div className="card card-pad">
          <div style={{fontWeight:700,marginBottom:12,fontSize:'.88rem'}}>Competitions by Level</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {Object.entries(byLevel).sort((a,b)=>b[1]-a[1]).map(([l,v])=>(
              <div key={l} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:10,padding:'10px 14px',textAlign:'center',minWidth:80}}>
                <div style={{fontSize:'1.4rem',fontWeight:800,color:'var(--accent)',lineHeight:1}}>{v}</div>
                <div style={{fontSize:'.63rem',color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.05em',marginTop:3}}>{l}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── COMP FORM ────────────────────────────────────────────────────────────────
// participants = [{memberId, role, result}]
const COMP_DEF = { comp_date:'', code:'', competition:'', organizer:'', format:'BP', type:'Open', level:'National', results:[], setting:'In-Person', tabulation:'', participants:[] };

function CompForm({ comp, members, onSave, onClose }) {
  const [f, setF] = useState(comp ? {...COMP_DEF,...comp,participants:(comp.participants||[]).map(p=>({...p}))} : {...COMP_DEF});
  const [newResult, setNewResult] = useState('');
  const [partSearch, setPartSearch] = useState('');
  const [partTab, setPartTab] = useState('all');
  const set = (k,v) => setF(p=>({...p,[k]:v}));

  const addResult = () => { if (!newResult.trim()) return; set('results',[...(f.results||[]),newResult.trim()]); setNewResult(''); };
  const removeResult = i => set('results',f.results.filter((_,j)=>j!==i));

  const getParticipant = id => f.participants?.find(p=>p.memberId===id)||null;
  const togglePart = (id, role) => {
    const cur = f.participants||[];
    const ex = cur.find(p=>p.memberId===id);
    if (ex) {
      if (ex.role===role) set('participants',cur.filter(p=>p.memberId!==id));
      else set('participants',cur.map(p=>p.memberId===id?{...p,role}:p));
    } else {
      set('participants',[...cur,{memberId:id,role,result:''}]);
    }
  };

  const filteredMembersForPicker = useMemo(() => {
    const s = partSearch.toLowerCase();
    return members.filter(m => {
      if (s && !m.full_name?.toLowerCase().includes(s)) return false;
      if (partTab === 'all') return true;
      const p = getParticipant(m.id);
      return p?.role === partTab;
    });
  }, [members, partSearch, partTab, f.participants]);

  const setResult = (id, result) => {
    set('participants',f.participants.map(p=>p.memberId===id?{...p,result}:p));
  };

  const selectedParticipants = (f.participants||[]).map(p=>({...p,member:members.find(m=>m.id===p.memberId)})).filter(p=>p.member);
  const adjus = selectedParticipants.filter(p=>p.role==='Adjudicator');
  const debs = selectedParticipants.filter(p=>p.role==='Debater');

  const save = () => { if (!f.code?.trim()||!f.competition?.trim()) return alert('Code and name required.'); onSave(f); };

  return (
    <Modal title={comp?'Edit Competition':'Add Competition'} onClose={onClose} wide>
      <div className="g2">
        <div className="fg"><label>Short Code *</label><input value={f.code} onChange={e=>set('code',e.target.value)} placeholder="NUDC 2024" /></div>
        <div className="fg"><label>Date</label><input value={f.comp_date||''} onChange={e=>set('comp_date',e.target.value)} placeholder="14-15 Mar 2026" /></div>
        <div className="fg span2"><label>Full Competition Name *</label><input value={f.competition} onChange={e=>set('competition',e.target.value)} placeholder="National Universities Debating Championship 2024" /></div>
        <div className="fg"><label>Organizer</label><input value={f.organizer||''} onChange={e=>set('organizer',e.target.value)} placeholder="Dikti" /></div>
        <div className="fg"><label>Format</label><select value={f.format} onChange={e=>set('format',e.target.value)}><option>BP</option><option>AP</option></select></div>
        <div className="fg"><label>Type</label><select value={f.type} onChange={e=>set('type',e.target.value)}>{['Open','Varsity','School','ProAms'].map(o=><option key={o}>{o}</option>)}</select></div>
        <div className="fg"><label>Level</label><select value={f.level} onChange={e=>set('level',e.target.value)}>{['International','National','Regional','Provincial','University'].map(o=><option key={o}>{o}</option>)}</select></div>
        <div className="fg"><label>Setting</label><select value={f.setting} onChange={e=>set('setting',e.target.value)}>{['In-Person','Online','Hybrid'].map(o=><option key={o}>{o}</option>)}</select></div>
        <div className="fg"><label>Tabulation Link</label><input value={f.tabulation||''} onChange={e=>set('tabulation',e.target.value)} placeholder="https://tabbycat.link/…" /></div>
        <div className="fg span2">
          <label>Overall Competition Results</label>
          <div style={{display:'flex',gap:7,marginBottom:8}}>
            <input value={newResult} onChange={e=>setNewResult(e.target.value)} placeholder="e.g. Break Grandfinal, 3rd Speaker…" onKeyDown={e=>e.key==='Enter'&&addResult()} style={{flex:1,padding:'8px 11px',border:'1px solid var(--border2)',borderRadius:'var(--r)',fontSize:'.84rem',background:'var(--surface2)',color:'var(--text)',outline:'none'}} />
            <button className="btn btn-ghost btn-sm" onClick={addResult}>+ Add</button>
          </div>
          <div className="result-tags">{(f.results||[]).map((r,i)=><span key={i} className="result-tag">{r}<button onClick={()=>removeResult(i)}>×</button></span>)}</div>
        </div>
      </div>

      {/* Participant Picker — searchable */}
      <div style={{marginTop:16}}>
        <div style={{fontSize:'.68rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',color:'var(--text3)',marginBottom:8}}>
          Participants {(f.participants||[]).length>0 && <span style={{color:'var(--accent)'}}>({(f.participants||[]).length} selected)</span>}
        </div>
        {selectedParticipants.length > 0 && (
          <div className="part-selected-chips">
            {adjus.map(p=><span key={p.memberId} className="part-chip adj">{p.member.full_name}<button className="part-chip-x" onClick={()=>togglePart(p.memberId,'Adjudicator')}>×</button></span>)}
            {debs.map(p=><span key={p.memberId} className="part-chip deb">{p.member.full_name}<button className="part-chip-x" onClick={()=>togglePart(p.memberId,'Debater')}>×</button></span>)}
          </div>
        )}
        <div className="part-tabs">
          {[['all',`All (${members.length})`],['Debater',`Debaters (${debs.length})`],['Adjudicator',`Adjudicators (${adjus.length})`]].map(([v,l])=>(
            <button key={v} className={`part-tab ${partTab===v?'on':''}`} onClick={()=>setPartTab(v)}>{l}</button>
          ))}
        </div>
        <div className="part-search-wrap">
          <span className="part-search-ico">⌕</span>
          <input placeholder="Search member name…" value={partSearch} onChange={e=>setPartSearch(e.target.value)} />
        </div>
        <div className="part-list-box">
          {filteredMembersForPicker.length===0
            ? <div style={{padding:14,textAlign:'center',color:'var(--text3)',fontSize:'.8rem'}}>No members found</div>
            : filteredMembersForPicker.map(m=>{
              const p=getParticipant(m.id);
              return (
                <div key={m.id} className={`part-list-item ${p?'sel':''}`}>
                  <div style={{flex:1,minWidth:0}}>
                    <div className="part-list-name">{m.full_name}</div>
                    <div className="part-list-meta">{m.division} · <span style={{color:m.rank==='Ace'?'var(--gold)':m.rank==='Troop'?'var(--blue)':'var(--text3)'}}>{m.rank}</span></div>
                  </div>
                  <div className="part-list-roles">
                    {['Debater','Adjudicator'].map(r=>(
                      <button key={r} className={`role-btn ${p?.role===r?'on':''}`} onClick={()=>togglePart(m.id,r)}>{r==='Debater'?'Deb':'Adj'}</button>
                    ))}
                  </div>
                </div>
              );
            })
          }
        </div>
      </div>

      {/* Per-person results */}
      {selectedParticipants.length > 0 && (
        <div style={{marginTop:16}}>
          <div style={{fontSize:'.68rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',color:'var(--text3)',marginBottom:8}}>Individual Results (optional)</div>
          <div className="per-person-result-wrap">
            {adjus.length > 0 && <div style={{fontSize:'.66rem',color:'var(--purple)',fontWeight:600,marginBottom:4}}>Adjudicators</div>}
            {adjus.map(p=>(
              <div key={p.memberId} className="ppr-row">
                <span className="ppr-name">{p.member.full_name}</span>
                <span className="ppr-role adjudicator">Adj</span>
                <input className="ppr-input" value={p.result||''} onChange={e=>setResult(p.memberId,e.target.value)} placeholder="e.g. Break Judge" />
              </div>
            ))}
            {debs.length > 0 && <div style={{fontSize:'.66rem',color:'var(--blue)',fontWeight:600,marginBottom:4,marginTop:4}}>Debaters</div>}
            {debs.map(p=>(
              <div key={p.memberId} className="ppr-row">
                <span className="ppr-name">{p.member.full_name}</span>
                <span className="ppr-role debater">Deb</span>
                <input className="ppr-input" value={p.result||''} onChange={e=>setResult(p.memberId,e.target.value)} placeholder="e.g. Grandfinal, 2nd Speaker" />
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="m-footer"><button className="btn btn-ghost" onClick={onClose}>Cancel</button><button className="btn btn-primary" onClick={save}>{comp?'Save Changes':'Add Competition'}</button></div>
    </Modal>
  );
}

// ─── ADMIN MEMBERS ────────────────────────────────────────────────────────────
function AdminMembers({ members, refetch, toast }) {
  const [search, setSearch] = useState('');
  const [showForm, setShowForm] = useState(false);
  const [editM, setEditM] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [activeOrder, setActiveOrder] = useState('debaters');
  // Two completely separate ordered ID arrays — never share state
  const [debOrder, setDebOrder] = useState([]);
  const [memOrder, setMemOrder] = useState([]);

  useEffect(() => {
    // Initialize from DB order columns so they start correctly separated
    if (members.length > 0) {
      if (debOrder.length === 0) {
        const sorted = [...members].sort((a,b)=>(a.order_debaters||9999)-(b.order_debaters||9999));
        setDebOrder(sorted.map(m=>m.id));
      }
      if (memOrder.length === 0) {
        // Membership order excludes Alumni and Ex
        const sorted = [...members]
          .filter(m=>!m.classes?.includes('Alumni')&&!m.classes?.includes('Ex'))
          .sort((a,b)=>(a.order_membership||9999)-(b.order_membership||9999));
        setMemOrder(sorted.map(m=>m.id));
      }
    }
  }, [members]);

  const orderedMembers = useMemo(() => {
    if (activeOrder === 'debaters') {
      const byId = Object.fromEntries(members.map(m=>[m.id,m]));
      const sorted = debOrder.map(id=>byId[id]).filter(Boolean);
      const extras = members.filter(m=>!debOrder.includes(m.id));
      return [...sorted, ...extras];
    } else {
      // Membership view: exclude Alumni and Ex entirely
      const eligible = members.filter(m=>!m.classes?.includes('Alumni')&&!m.classes?.includes('Ex'));
      const byId = Object.fromEntries(eligible.map(m=>[m.id,m]));
      const sorted = memOrder.map(id=>byId[id]).filter(Boolean);
      const extras = eligible.filter(m=>!memOrder.includes(m.id));
      return [...sorted, ...extras];
    }
  }, [members,debOrder,memOrder,activeOrder]);

  const filtered = useMemo(()=>{
    const s=search.toLowerCase();
    return orderedMembers.filter(m=>!s||m.full_name?.toLowerCase().includes(s)||m.nim?.includes(s));
  },[orderedMembers,search]);

  const saveOrder = async arr => {
    const field = activeOrder==='debaters'?'order_debaters':'order_membership';
    const ids = arr.map(m=>m.id);
    // Update only the active order's state — never touch the other
    if (activeOrder === 'debaters') setDebOrder(ids);
    else setMemOrder(ids);
    for (let i=0;i<arr.length;i++) await sb.from('members').update({[field]:i+1}).eq('id',arr[i].id);
    toast('Order saved');
  };

  const { onDragStart, onDragOver, onDrop, onDragEnd, isDragOver } = useDragReorder(
    filtered,
    arr => {
      const ids = arr.map(m=>m.id);
      if (activeOrder === 'debaters') setDebOrder(ids);
      else setMemOrder(ids);
    },
    saveOrder
  );

  const addOrUpdate = async form => {
    if (editM) {
      const { id, created_at, ...rest } = form;
      const { error } = await sb.from('members').update(rest).eq('id',editM.id);
      if (error) toast(error.message,'error'); else { toast('Member updated'); await refetch(); }
    } else {
      const { error } = await sb.from('members').insert(form);
      if (error) toast(error.message,'error'); else { toast('Member added'); await refetch(); }
    }
    setShowForm(false); setEditM(null);
  };

  const del = async id => {
    await sb.from('members').delete().eq('id',id);
    toast('Deleted'); await refetch(); setConfirm(null);
  };

  return (
    <div className="admin-content">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:10}}>
        <div>
          <h2 style={{fontFamily:'Playfair Display,serif',fontSize:'1.25rem',marginBottom:2}}>Manage Members</h2>
          <p style={{color:'var(--text3)',fontSize:'.78rem'}}>{members.length} total · drag ⠿ to reorder</p>
        </div>
        <button className="btn btn-primary btn-sm" onClick={()=>{setEditM(null);setShowForm(true);}}>+ Add Member</button>
      </div>
      <div className="toolbar" style={{marginBottom:10}}>
        <div className="search-wrap"><span className="search-ico">⌕</span><input placeholder="Search…" value={search} onChange={e=>setSearch(e.target.value)} /></div>
        <div style={{display:'flex',gap:5,alignItems:'center'}}>
          <span style={{fontSize:'.72rem',color:'var(--text3)',fontWeight:600}}>Order for:</span>
          {['debaters','membership'].map(o=>(
            <button key={o} className={`btn btn-sm ${activeOrder===o?'btn-primary':'btn-outline'}`} onClick={()=>setActiveOrder(o)} style={{textTransform:'capitalize'}}>{o}</button>
          ))}
        </div>
      </div>
      <div className="card">
        <div className="tbl-wrap">
          <table>
            <thead><tr><th style={{width:24}}></th><th>#</th><th>Name</th><th>NIM</th><th>Div</th><th>Rank</th><th>Class</th>{activeOrder==='membership'&&<th>Role</th>}<th>Status</th><th>Comps</th><th>Rds</th><th>Brks</th><th>Actions</th></tr></thead>
            <tbody>
              {filtered.map((m,i)=>(
                <tr key={m.id} className={`drag-row ${isDragOver(i)?'drag-over':''}`} draggable onDragStart={e=>onDragStart(e,i)} onDragOver={e=>onDragOver(e,i)} onDrop={e=>onDrop(e,i)} onDragEnd={onDragEnd}>
                  <td><span className="drag-handle">⠿</span></td>
                  <td style={{color:'var(--text3)',fontWeight:600,fontSize:'.72rem'}}>{i+1}</td>
                  <td style={{fontWeight:600,whiteSpace:'nowrap'}}>{m.full_name}</td>
                  <td style={{fontFamily:'monospace',fontSize:'.72rem',color:'var(--text3)'}}>{m.nim||'—'}</td>
                  <td><DivBadge div={m.division}/></td>
                  <td><RankBadge rank={m.rank}/></td>
                  <td><ClassBadges classes={m.classes}/></td>
                  {activeOrder==='membership'&&<td><span className={`badge ${m.membership_status==='President'||m.membership_status==='Vice President'?'b-navy':m.membership_status==='Secretary'||m.membership_status==='Treasurer'?'b-gold':m.membership_status?.includes('Director')?'b-blue':m.membership_status?.includes('Officer')?'b-purple':'b-gray'}`} style={{fontSize:'.65rem'}}>{m.membership_status||'Member'}</span></td>}
                  <td><StatusBadge s={m.active_status}/></td>
                  <td style={{textAlign:'center',fontWeight:700,color:'var(--accent)'}}>{m.total_competitions||0}</td>
                  <td style={{textAlign:'center',fontWeight:600}}>{m.total_rounds||0}</td>

                  <td><div style={{display:'flex',gap:4}}><button className="btn btn-outline btn-xs" onClick={()=>{setEditM(m);setShowForm(true);}}>Edit</button><button className="btn btn-danger btn-xs" onClick={()=>setConfirm(m.id)}>Del</button></div></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

    </div>
  );
}

// ─── ADMIN COMPETITIONS ───────────────────────────────────────────────────────
function AdminCompetitions({ competitions, members, refetch, toast }) {
  const [showForm, setShowForm] = useState(false);
  const [editC, setEditC] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [ordered, setOrdered] = useState([]);
  useEffect(()=>{setOrdered([...competitions]);},[competitions]);

  const saveOrder = async arr => {
    for (let i=0;i<arr.length;i++) await sb.from('competitions').update({order_index:i+1}).eq('id',arr[i].id);
    toast('Order saved');
  };
  const { onDragStart, onDragOver, onDrop, onDragEnd, isDragOver } = useDragReorder(ordered,setOrdered,saveOrder);

  const addOrUpdate = async form => {
    if (editC) {
      const { id, created_at, ...rest } = form;
      const { error } = await sb.from('competitions').update(rest).eq('id',editC.id);
      if (error) toast(error.message,'error'); else { toast('Updated'); await refetch(); }
    } else {
      const { error } = await sb.from('competitions').insert({...form,order_index:competitions.length+1});
      if (error) toast(error.message,'error'); else { toast('Added'); await refetch(); }
    }
    setShowForm(false); setEditC(null);
  };
  const del = async id => { await sb.from('competitions').delete().eq('id',id); toast('Deleted'); await refetch(); setConfirm(null); };

  return (
    <div className="admin-content">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:10}}>
        <div><h2 style={{fontFamily:'Playfair Display,serif',fontSize:'1.25rem',marginBottom:2}}>Manage Competitions</h2><p style={{color:'var(--text3)',fontSize:'.78rem'}}>{competitions.length} competitions · drag to reorder</p></div>
        <button className="btn btn-primary btn-sm" onClick={()=>{setEditC(null);setShowForm(true);}}>+ Add Competition</button>
      </div>
      <div className="card">
        <div className="tbl-wrap">
          <table>
            <thead><tr><th style={{width:24}}></th><th>#</th><th>Code</th><th>Competition</th><th>Date</th><th>Fmt</th><th>Level</th><th>Participants</th><th>Actions</th></tr></thead>
            <tbody>
              {ordered.map((c,i)=>(
                <tr key={c.id} className={`drag-row ${isDragOver(i)?'drag-over':''}`} draggable onDragStart={e=>onDragStart(e,i)} onDragOver={e=>onDragOver(e,i)} onDrop={e=>onDrop(e,i)} onDragEnd={onDragEnd}>
                  <td><span className="drag-handle">⠿</span></td>
                  <td style={{color:'var(--text3)',fontWeight:600,fontSize:'.72rem'}}>{i+1}</td>
                  <td style={{fontWeight:700,color:'var(--accent)',fontSize:'.78rem',whiteSpace:'nowrap'}}>{c.code}</td>
                  <td style={{fontSize:'.8rem',maxWidth:160}}>{c.competition}</td>
                  <td style={{fontSize:'.74rem',color:'var(--text3)',whiteSpace:'nowrap'}}>{c.comp_date||'—'}</td>
                  <td><FormatBadge f={c.format}/></td>
                  <td style={{fontSize:'.76rem'}}>{c.level}</td>
                  <td style={{textAlign:'center'}}>{(c.participants||[]).length}</td>
                  <td><div style={{display:'flex',gap:4}}><button className="btn btn-outline btn-xs" onClick={()=>{setEditC(c);setShowForm(true);}}>Edit</button><button className="btn btn-danger btn-xs" onClick={()=>setConfirm(c.id)}>Del</button></div></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
      {showForm && <CompForm comp={editC} members={members} onSave={addOrUpdate} onClose={()=>{setShowForm(false);setEditC(null);}} />}
      {confirm && <Modal title="Delete?" onClose={()=>setConfirm(null)} sm><p style={{color:'var(--text3)'}}>Permanently delete this competition?</p><div className="m-footer"><button className="btn btn-ghost" onClick={()=>setConfirm(null)}>Cancel</button><button className="btn btn-danger" onClick={()=>del(confirm)}>Delete</button></div></Modal>}
    </div>
  );
}

function AdminDashboard({ members, competitions }) {

  const totalBreaks = members.reduce((s,m)=>s+(m.total_breaking||0),0);
  const byDiv = { English:members.filter(m=>m.division==='English').length, Indonesia:members.filter(m=>m.division==='Indonesia').length, Flex:members.filter(m=>m.division==='Flex').length };
  const byRank = { Ace:nonAlumni.filter(m=>m.rank==='Ace').length, Troop:nonAlumni.filter(m=>m.rank==='Troop').length, Trainee:nonAlumni.filter(m=>m.rank==='Trainee').length };
  const topRounds = [...members].sort((a,b)=>(b.total_rounds||0)-(a.total_rounds||0)).slice(0,10);
  const topBreaks = [...members].sort((a,b)=>(b.total_breaking||0)-(a.total_breaking||0)).slice(0,10);

            <div style={{fontWeight:700,fontSize:'.86rem',marginBottom:2}}>Export Data</div>

              <span>🎤</span> Debaters
            </button>
            <button className="btn btn-ghost btn-sm" onClick={()=>exportMembership(members)} style={{gap:5}}>
              <span>📋</span> Membership
            </button>

              <span>🏆</span> Competitions
            </button>
            <button className="btn btn-primary btn-sm" onClick={()=>exportAll(members,competitions)} style={{gap:5}}>
              <span>⬇️</span> Export All
            </button>
          </div>
        </div>
      </div>
      <div className="dash-stat-grid" style={{gridTemplateColumns:'repeat(2,1fr)'}}>
        {[
          ['Members',members.length,`${active.length} active`,'var(--accent)'],
          ['Competitions',competitions.length,`${competitions.filter(c=>c.format==='BP').length} BP · ${competitions.filter(c=>c.format==='AP').length} AP`,'var(--gold)'],
          ['Total Rounds',totalRounds,`avg ${members.length?Math.round(totalRounds/members.length):0}/member`,'var(--green)'],
          ['Total Breaks',totalBreaks,'breaking performances','var(--accent2)'],
        ].map(([l,v,sub,c])=>(
          <div key={l} className="dash-card"><div className="dash-card-stripe" style={{background:c}}/><div className="dash-num" style={{color:c}}>{v}</div><div className="dash-lbl">{l}</div><div className="dash-sub">{sub}</div></div>

          <div style={{fontWeight:700,marginBottom:12,fontSize:'.86rem'}}>By Division</div>

      </div>
      {Object.keys(byLevel).length>0 && (
        <div className="card card-pad">
          <div style={{fontWeight:700,marginBottom:12,fontSize:'.86rem'}}>Competitions by Level</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {Object.entries(byLevel).map(([l,v])=>(
              <div key={l} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:10,padding:'10px 14px',textAlign:'center',minWidth:80}}>

              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── SUPABASE: extra data hooks ───────────────────────────────────────────────
function useBoards() {
  const [boards, setBoards] = useState([]);
  const fetch = async () => { const { data } = await sb.from('boards').select('*').order('sort_order',{ascending:true}); setBoards(data||[]); };
  useEffect(() => {
    fetch();
    const ch = sb.channel('boards-ch').on('postgres_changes',{event:'*',schema:'public',table:'boards'},fetch).subscribe();
    return () => sb.removeChannel(ch);
  }, []);
  return { boards, refetch: fetch };
}
function useHof() {
  const [hof, setHof] = useState([]);
  const fetch = async () => { const { data } = await sb.from('hall_of_fame').select('*').order('sort_order',{ascending:true}); setHof(data||[]); };
  useEffect(() => {
    fetch();
    const ch = sb.channel('hof-ch').on('postgres_changes',{event:'*',schema:'public',table:'hall_of_fame'},fetch).subscribe();
    return () => sb.removeChannel(ch);
  }, []);
  return { hof, refetch: fetch };
}
function useInfoSettings() {
  const [info, setInfo] = useState({ org_about: 'A prestigious student organization at Universitas Negeri Manado that focuses on the proliferation of parliamentary debate.\n\nFlagship Project: Unima Debate League\n\nUniversitas Negeri Manado, Tondano, Sulawesi Utara, Indonesia' });
  useEffect(() => {
    sb.from('app_settings').select('value').eq('key','info_content').single().then(({ data }) => {
      if (data?.value) { try { setInfo(JSON.parse(data.value)); } catch {} }
    });
  }, []);
  const saveInfo = async (newInfo) => {
    setInfo(newInfo);
    await sb.from('app_settings').upsert({ key:'info_content', value: JSON.stringify(newInfo) });
  };
  return { info, saveInfo };
}

// ─── LOCAL STORAGE: user preferences ─────────────────────────────────────────
function useUserPrefs() {
  const load = () => {
    try { return JSON.parse(localStorage.getItem('eds_user_prefs') || '{}'); } catch { return {}; }
  };
  const defaults = { theme:'dark', accent_color:'blue', compact_tables:false, show_rank_icons:true };
  const [prefs, setPrefs] = useState(() => ({ ...defaults, ...load() }));
  const setPref = (key, value) => {
    setPrefs(p => { const n = { ...p, [key]: value }; localStorage.setItem('eds_user_prefs', JSON.stringify(n)); return n; });
  };
  return { prefs, setPref };
}

    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');

    document.body.setAttribute('data-compact', v ? 'true' : 'false');
    setPref('compact_tables', v);

  return (
    <div className="uprefs-overlay" onClick={e => e.target === e.currentTarget && onClose()}>

            <button className={`btn btn-xs ${prefs.theme === 'light' ? 'btn-primary' : 'btn-ghost'}`} onClick={() => handleTheme('light')}>☀️</button>
          </div>
        </div>
        <div className="uprefs-row">
          <div className="uprefs-label">
            Accent Color
            <div className="uprefs-sub">Highlight colors</div>
          </div>
          <div className="color-chips">
            {ACCENT_COLORS.map(c => (
              <div key={c.id} title={c.id} className={`color-chip ${prefs.accent_color === c.id ? 'on' : ''}`} style={{ background: c.val, width: 20, height: 20 }} onClick={() => handleAccent(c.id)} />

          </div>
        </div>
        <div className="uprefs-row">
